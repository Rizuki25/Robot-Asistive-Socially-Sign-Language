# ==============================================================================
# Konfigurasi Model Gabungan (36 Kelas: 26 Huruf + 10 Kata)
# ==============================================================================

paths:
  letters_landmarks: "dataset/letters/landmarks_90"
  words_landmarks: "dataset/words/landmarks_90"
  processed: "dataset/combined/processed_90"
  models: "outputs/combined_90/models"
  logs: "outputs/combined_90/logs"
  figures: "outputs/combined_90/figures"
  results: "outputs/combined_90/results"

landmark:
  max_num_hands: 2
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

preprocessing:
  max_seq_length: 90
  augment_factor: 1
  test_size: 0.15
  val_size: 0.15
  random_seed: 42
  input_size: 140

model:
  name: "BiLSTM_Combined_36"
  input_size: 140
  hidden_size: 128
  num_layers: 2
  dropout: 0.3

training:
  batch_size: 32
  epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 15
  scheduler_step: 15
  scheduler_gamma: 0.5

